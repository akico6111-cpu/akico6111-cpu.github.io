<style>

ontent:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font:38px Georgia,serif;text-shadow:0 0 20px rgba(229,195,120,.5)}.front{transform:rotateY(180deg);color:#281d27;background:linear-gradient(180deg,#f6ecd3,#e5d0a7);border:1px solid #c9ad70}.front:before{content:"";position:absolute;inset:6px;border:1px solid rgba(65,45,50,.3);border-radius:13px}.num{position:absolute;top:10px;left:12px;font:700 14px Georgia}.suit{position:absolute;top:10px;right:12px;font:15px Georgia}.art{height:130px;display:grid;place-items:center;padding-top:18px;font-size:58px;filter:drop-shadow(0 5px 7px rgba(0,0,0,.15))}.name{text-align:center;font:700 21px Georgia,"Songti SC",serif;letter-spacing:.07em}.key{text-align:center;font-size:11px;color:#5e4e57;line-height:1.45;padding:7px 10px 0}.small .back:after{font-size:25px}.small .num,.small .suit{font-size:10px;top:7px}.small .art{height:78px;font-size:35px;padding-top:12px}.small .name{font-size:13px}.small .key{display:none}.pos{font-size:11px;color:var(--muted);margin-top:6px}@keyframes deal{from{opacity:0;transform:translateY(-22px) rotate(4deg)}to{opacity:1;transform:none}}.deal{animation:deal .35s both}@keyframes shuf{0%,100%{transform:none}35%{transform:translateX(-24px) rotate(-5deg)}70%{transform:translateX(24px) rotate(5deg)}}.shuffling{animation:shuf .45s ease 2}.reading,.history{display:none;margin-top:15px}.show{display:block}.reading h2,.history h2{font:600 23px Georgia,"Songti SC",serif;margin:0 0 12px}.echo{color:var(--muted);line-height:1.6;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.item,.hist{background:rgba(0,0,0,.16);border:1px solid var(--line);border-radius:15px;padding:12px}.item b{display:block;color:var(--gold);margin-bottom:6px}.item p,.hist p{margin:0;color:#dfd4e7;font-size:13px;line-height:1.65}.combo{margin-top:12px;padding:14px;border:1px solid rgba(229,195,120,.18);border-radius:16px;background:linear-gradient(135 </style></head><body><div class="wrap">
<header class="hero"><div><h1>小爱的雷诺曼秘仪牌桌</h1><p>36 张完整牌组 · 自己选牌 · 随机发牌 · 组合解读 · 私人牌册</p></div><div class="seal">☾</div></header>
<section class="panel"><div class="controls"><div class="q"><label>这一次，你想问什么？</label><textarea id="question" placeholder="把问题放在心里，也可以写在这里……"></textarea></div><div><label>牌阵</label><select id="count"><option value="1">单张指引</option><option value="3">三张时间流</option><option value="4" selected>四张关系牌</option><option value="5">五张发展牌</option><option value="9">九宫格</option><option value="36">大桌阵</option></select></div><button class="btn primary" onclick="beginDraw()">洗牌并开始</button></div>
<div class="row"><button id="randomBtn" class="pill on" onclick="setMode('random')">随机发牌</button><button id="manualBtn" class="pill" onclick="setMode('manual')">铺开 36 张自己选</button></div>
<div class="row"><button class="btn ghost" onclick="cutDeck()">切牌</button><button class="btn ghost" onclick="revealAll()">全部翻开</button><button class="btn ghost" onclick="collectCards()">收牌</button><button class="btn ghost" onclick="toggleHistory()">历史记录</button></div>
<div class="status"><span id="status">牌组已经安静地等待你。</span><span>随机源：<strong id="rng">安全随机</strong></span></div></section>
<section class="panel stage"><div id="empty" class="empty"><div><div class="moon">☽</div><p>写下问题，选择牌阵，然后洗牌。<br>也可以铺开 36 张，亲手挑选。</p></div></div><div id="area" class="area"><div id="hint" class="hint"></div><div id="host"></div></div></section>
<section id="reading" class="panel reading"><h2>本次牌面</h2><div id="echo" class="echo"></div><div id="readGrid" class="grid"></div><div class="combo"><h3>✦ 组合解读</h3><div id="combo"></div></div><div style="margin-top:12px"><label>你的第一直觉与现实记录</label><textarea id="notes" placeholder="哪张牌最吸引你？现实里有哪些证据支持或反驳它？"></textarea></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="copyReading()">复制牌面</button><button class="btn ghost" onclick="saveReading()">保存记录</button></div></section>
<section id="history" class="panel history"><h2>私人牌册</h2><div id="histList"></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="clearHistory()">清空历史</button></div></section>
<div class="foot">牌面用于象征性联想、自我观察和梳理现实证据，不是对他人内心的事实读取。<br>问题与记录只保存在当前设备的浏览器中。</div></div><div id="toast" class="toast"></div>
<script>
var RAW=`1|骑士|🐎|♥9|消息・来访・行动|新消息、快速靠近，某人或某事正在到来。|msg,move,pos
2|三叶草|☘️|♦6|机会・幸运・短暂|轻松的小机会，宜顺势，不宜过度放大。|chance,pos

17|鹳|🕊️|♥Q|变化・迁移・更新|关系状态、生活环境或角色正在改变。|change,move
18|狗|🐕|♥10|忠诚・朋友・支持|可靠陪伴、友情、信任与支持。|friend,stable,pos

20|花园|🌷|♠8|社交・公众・聚会|公开场合、人际网络、活动与被看见。|social,public
21|山|⛰️|♣8|阻碍・延迟・冷却|进展受阻、距离较大，需要耐心或换路。|block,delay,neg
22|道路|🛤️|♦Q|选择・分岔・自由|多个可能并存，关键是愿意承担哪条路。|choice,unclear
23|老鼠|🐭|♣7|消耗・焦虑・流失|慢性损耗和小问题累积，宜及时止损。|loss,anxiety,neg
24|心|❤️|♥J|爱意・热情・真心|真实情感投入、喜欢、温暖与渴望。|love,pos
25|戒指|💍|♣A|承诺・关系・循环|契约、稳定联结，也可能是重复模式。|commit,relation
26|书|📖|♦10|秘密・知识・未知|尚未公开的信息，或需要继续了解的部分。|secret,unknown
27|信|✉️|♠7|文字・通知・文件|具体消息、聊天记录、合同或书面表达。|msg,document
28|男士|🤵|♥A|男性人物・主动方|所问男性、重要男性角色，或外显主动的一方。|person,male
29|女士|👩|♠A|女性人物・接收方|所问女性、重要女性角色，或更重感受的一方。|person,female
30|百合|⚜️|♠K|成熟・平静・亲密|成熟关系、安宁、伦理，也可指身体亲密。|mature,intimacy
31|太阳|☀️|♦A|成功・清晰・活力|肯定、热度和可见成果，倾向积极发展。|clear,pos,success
32|月亮|🌙|♥8|情绪・认可・直觉|情绪回响、浪漫想象与被认可的需要。|emotion,romance
33|钥匙|🗝️|♦8|确定・解锁・答案|关键点出现，事情重要，也更接近明确答案。|clear,answer,pos
34|鱼|🐟|♦K|金钱・流动・自由|资源、商业、欲望流动与不受拘束。|money,flow
35|锚|⚓|♠9|稳定・坚持・停驻|长期维持、可靠，也可能被固定在某状态。|stable,slow
36|十字架|✝️|♣6|负担・命题・考验|必须面对的重量、责任、意义与人生课题。|burden,neg`;
var C=RAW.split('\n').map(function(x){var a=x.split('|');return{n:+a[0],name:a[1],art:a[2],suit:a[3],key:a[4],brief:a[5],tags:a[6].split(',')}}),mode='random',deck=[],selected=[],revealed={},need=4,q='';
function $(x){return document.getElementById(x)}function tag(c,t){return c.tags.indexOf(t)>-1}function msg(t){var x=$('toast');x.textContent=t;x.classList.add('on');setTimeout(function(){x.classList.remove('on')},1500)}
function rnd(max){try{if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);$('rng').textContent='浏览器加密随机';return a[0]%max}}catch(e){}$('rng').textContent='兼容随机';return Math.floor(Math.random()*max)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function setMode(m){mode=m;$('randomBtn').className='pill '+(m==='random'?'on':'');$('manualBtn').className='pill '+(m==='manual'?'on':'');$('status').textContent=m==='random'?'随机发牌模式：牌会自动抽出。':'手动选牌模式：36 张牌背由你亲自选择。'}
function beginDraw(){need=+$('count').value;q=$('question').value.trim();selected=[];revealed={};deck=shuffle(C);$('empty').style.display='none';$('area').style.display='block';$('reading').classList.remove('show');if(mode==='random'){selected=deck.slice(0,need);$('hint').textContent='牌已经抽出。请按自己的节奏逐张翻开。';renderSpread()}else{$('hint').textContent='从 36 张牌背中选择 '+need+' 张。已选择 0 / '+need+'。';renderDeck()}}
function html(c,i,small,up){return '<div class="slot deal" style="animation-delay:'+(i*.024)+'s"><div id="c'+i+'" class="card '+(small?'small ':'')+(up?'flip ':'')+'" onclick="'+(small?'choose('+i+')':'flip('+i+')')+'"><div class="face back"></div><div class="face front"><div class="num">'+c.n+'</div><div class="suit">'+c.suit+'</div><div class="art">'+c.art+'</div><div class="name">'+c.name+'</div><div class="key">'+c.key+'</div></div></div>'+(small?'':'<div class="pos">第 '+(i+1)+' 张</div>')+'</div>'}

function cutDeck(){if(!deck.length)deck=shuffle(C);var n=rnd(deck.length-1)+1;deck=deck.slice(n).concat(deck.slice(0,n));$('host').classList.add('shuffling');setTimeout(function(){$('host').classList.remove('shuffling')},900);$('status').textContent='已经在第 '+n+' 张处切牌。';msg('切牌完成')}
function collectCards(){selected=[];revealed={};deck=[];$('host').innerHTML='';$('area').style.display='none';$('empty').style.display='grid';$('reading').classList.remove('show');$('status').textContent='牌组已经收好。'}
function pair(a,b){if((tag(a,'msg')&&tag(b,'love'))||(tag(b,'msg')&&tag(a,'love')))return '情感会通过消息、电话或文字表达，但仍需看现实行动。';if((tag(a,'distance')&&tag(b,'love'))||(tag(b,'distance')&&tag(a,'love')))return '感情存在，却被距离、边界或心理抽离包围。';if((tag(a,'commit')&&tag(b,'love'))||(tag(b,'commit')&&tag(a,'love')))return '关系与承诺成为核心，重点是双方是否给出对等投入。';if((tag(a,'unclear')&&tag(b,'love'))||(tag(b,'unclear')&&tag(a,'love')))return '喜欢与不确定并存，浪漫感受可能比事实更清晰。';if((tag(a,'desire')&&tag(b,'love'))||(tag(b,'desire')&&tag(a,'love')))return '吸引力很强，但动机不止一种，不能只按深情解释。';if((tag(a,'possess')&&tag(b,'love'))||(tag(b,'possess')&&tag(a,'love')))return '爱意中混有保护、占有或权力意识，边界需要单独观察。';if((tag(a,'friend')&&tag(b,'love'))||(tag(b,'friend')&&tag(a,'love')))return '友情与爱意的边界正在变得模糊。';if((tag(a,'msg')&&tag(b,'clear'))||(tag(b,'msg')&&tag(a,'clear')))return '一条明确消息可能成为关键转折。';if((tag(a,'block')&&tag(b,'move'))||(tag(b,'block')&&tag(a,'move')))return '想推进却遇到阻碍，节奏可能反复或延迟。';if((tag(a,'anxiety')&&tag(b,'emotion'))||(tag(b,'anxiety')&&tag(a,'emotion')))return '情绪容易被反复思考放大，需要把直觉和证据分开。';if((tag(a,'neg')&&tag(b,'pos'))||(tag(b,'neg')&&tag(a,'pos')))return '吸引与风险同时出现，答案不是纯粹的是或否。';return a.name+'描述底色或起因，'+b.name+'更像反应、结果或下一步。'}
function combo(){if(selected.length===1)return '<p>这张牌应当作为当下主题，而不是绝对答案。它提示你最需要观察的现实变量。</p>';var h='',p=0,n=0,cl=0,u=0;selected.forEach(function(c){p+=tag(c,'pos');n+=tag(c,'neg');cl+=tag(c,'clear');u+=tag(c,'unclear')});for(var i=0;i<selected.length-1;i++)h+='<p><b>'+selected[i].name+' ＋ '+selected[i+1].name+'</b>：'+pair(selected[i],selected[i+1])+'</p>';var t=p>n+1?'整体偏积极，但机会不自动等于承诺。':n>p+1?'整体阻力较强，适合放慢节奏并检查边界。':'整体是混合牌面：机会、吸引与疑虑同时存在。';if(cl>u)t+=' 关键线索会逐渐落到具体事实上。';if(u>cl)t+=' 目前尤其不适合把猜测当成读心。';return h+'<p><b>全局气候</b>：'+t+'</p>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function renderReading(){$('echo').innerHTML=q?'问题：<strong>'+esc(q)+'</strong>':'这一次没有写下问题，牌面作为当下主题观察。';$('readGrid').innerHTML=selected.map(function(c,i){return '<div class="item"><b>'+(i+1)+'. '+c.n+'号 · '+c.name+'</b><p><strong>'+c.key+'</strong><br>'+c.brief+'</p></div>'}).join('');$('combo').innerHTML=combo();$('reading').classList.add('show')}
function text(){return '【小爱的雷诺曼牌面】\n问题：'+(q||'未填写问题')+'\n\n'+selected.map(function(c,i){return(i+1)+'. '+c.n+'号 '+c.name+'｜'+c.key+'｜'+c.brief}).join('\n')+($('notes').value.trim()?'\n\n记录：'+$('notes').value.trim():'')}
function copyReading(){if(!selected.length){msg('还没有牌面');return}var t=text();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){msg('已复制牌面')}).catch(function(){fallback(t)});else fallback(t)}function fallback(t){var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');msg('已复制牌面')}catch(e){prompt('请复制：',t)}document.body.removeChild(x)}
function load(){try{return JSON.parse(localStorage.getItem('xiaoai_lenormand_v2')||'[]')}catch(e){return[]}}function saveReading(){if(!selected.length){msg('还没有牌面');return}var a=load();a.unshift({time:new Date().toLocaleString(),q:q||'未填写问题',cards:selected.map(function(c){return c.name})});try{localStorage.setItem('xiaoai_lenormand_v2',JSON.stringify(a.slice(0,60)));msg('已收入私人牌册')}catch(e){msg('当前预览不允许本地保存')}renderHistory()}
function toggleHistory(){$('history').classList.toggle('show');if($('history').classList.contains('show')){renderHistory();$('history').scrollIntoView({behavior:'smooth'})}}function renderHistory(){var a=load();$('histList').innerHTML=a.length?a.map(function(x){return '<div class="hist"><time>'+esc(x.time)+'</time><h4>'+esc(x.q)+'</h4><p>'+esc(x.cards.join(' · '))+'</p></div>'}).join(''):'<div class="hist"><p>还没有保存过牌面。</p></div>'}function clearHistory(){if(confirm('确定清空本机保存的全部牌面吗？')){try{localStorage.removeItem('xiaoai_lenormand_v2')}catch(e){}renderHistory();msg('牌册已清空')}}
</script></body></html>
